<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>asmi has a new number</title>
<meta name="description" content="asmi moved. Tap to keep the conversation going in iMessage.">
<meta name="theme-color" content="#0B0A16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F4EFE6;
    --accent: #E0632F;
    --accent-warm: #F0A24E;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 26px;
    background: #07060F;
    color: var(--ink);
    font-family: 'Space Mono', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ============ SPACE SCENE ============ */
  .scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

  /* deep-space base — on-brand indigo/plum into near-black */
  .space-base {
    position: absolute; inset: 0;
    background: radial-gradient(140% 120% at 50% -10%, #2A2440, #16132A 34%, #0B0A16 62%, #07060F 100%);
  }

  /* drifting nebula clouds */
  .nebula {
    position: absolute; inset: -20%;
    background:
      radial-gradient(38% 30% at 22% 30%, rgba(126, 20, 255, 0.20), transparent 60%),
      radial-gradient(32% 26% at 78% 22%, rgba(70, 120, 200, 0.16), transparent 60%),
      radial-gradient(40% 34% at 62% 74%, rgba(224, 99, 47, 0.14), transparent 62%),
      radial-gradient(30% 26% at 30% 82%, rgba(160, 60, 200, 0.12), transparent 60%);
    filter: blur(14px);
    animation: nebula-drift 46s ease-in-out infinite alternate;
  }
  @keyframes nebula-drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-3%, 2.5%, 0) scale(1.08); }
  }

  /* three parallax star layers */
  .stars { position: absolute; inset: -50px; background-repeat: repeat; }
  .stars.s1 {
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 47% 62%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.6px 1.6px at 73% 12%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 88% 54%, rgba(255,255,255,0.85), transparent),
      radial-gradient(1.2px 1.2px at 28% 88%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 62% 40%, #fff, transparent);
    background-size: 420px 420px;
    animation: drift-slow 120s linear infinite, twinkle 5s ease-in-out infinite;
  }
  .stars.s2 {
    background-image:
      radial-gradient(1px 1px at 20% 40%, rgba(255,255,255,0.75), transparent),
      radial-gradient(1.1px 1.1px at 55% 78%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 82% 30%, rgba(255,255,255,0.72), transparent),
      radial-gradient(1.2px 1.2px at 35% 15%, rgba(255,255,255,0.68), transparent),
      radial-gradient(1px 1px at 70% 66%, rgba(255,255,255,0.7), transparent);
    background-size: 300px 300px;
    opacity: 0.8;
    animation: drift-med 80s linear infinite, twinkle 7s ease-in-out infinite reverse;
  }
  .stars.s3 {
    background-image:
      radial-gradient(0.9px 0.9px at 15% 70%, rgba(200,210,255,0.6), transparent),
      radial-gradient(0.9px 0.9px at 60% 25%, rgba(255,230,210,0.55), transparent),
      radial-gradient(0.9px 0.9px at 90% 80%, rgba(255,255,255,0.5), transparent),
      radial-gradient(0.9px 0.9px at 42% 50%, rgba(210,220,255,0.55), transparent);
    background-size: 220px 220px;
    opacity: 0.7;
    animation: drift-fast 55s linear infinite, twinkle 4s ease-in-out infinite;
  }
  @keyframes drift-slow { from { transform: translateY(0); } to { transform: translateY(-420px); } }
  @keyframes drift-med  { from { transform: translateY(0); } to { transform: translateY(-300px); } }
  @keyframes drift-fast { from { transform: translateY(0); } to { transform: translateY(-220px); } }
  @keyframes twinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.5; } }

  /* the planet — warm-lit limb echoing the brand terracotta, slow float */
  .planet-wrap {
    position: absolute;
    bottom: -32vmin; left: 50%;
    width: min(96vmin, 680px); height: min(96vmin, 680px);
    transform: translateX(-50%);
    animation: planet-float 26s ease-in-out infinite;
  }
  @keyframes planet-float {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-2.2vmin); }
  }
  .planet { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #120A22; }

  /* rotating surface — mottled bands scroll under the fixed lighting to read as spin */
  .surface {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 18% 34%, rgba(128, 100, 148, 0.55), transparent 22%),
      radial-gradient(circle at 60% 62%, rgba(70, 54, 92, 0.62), transparent 26%),
      radial-gradient(circle at 86% 30%, rgba(158, 112, 88, 0.34), transparent 20%),
      radial-gradient(circle at 40% 82%, rgba(92, 70, 116, 0.5), transparent 24%),
      linear-gradient(180deg, #2C2142, #1A1130);
    background-size: 40vmin 100%;
    background-repeat: repeat;
    animation: spin 44s linear infinite;
  }
  @keyframes spin { to { background-position: -40vmin 0; } }

  /* fixed spherical shading — light source top-left, deep terminator bottom-right */
  .shade {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 24%, rgba(255, 232, 205, 0.14), transparent 42%),
      radial-gradient(circle at 30% 26%, transparent 44%, rgba(0,0,0,0.55) 100%);
    box-shadow: inset -16vmin -12vmin 30vmin rgba(0,0,0,0.82);
  }

  /* warm-lit limb catching the star, gently pulsing */
  .rim {
    position: absolute; inset: -0.8vmin; border-radius: 50%;
    background: radial-gradient(circle at 28% 22%, rgba(245,172,92,0.85), rgba(224,99,47,0.35) 12%, transparent 34%);
    filter: blur(3px);
    mix-blend-mode: screen;
    opacity: 0.85;
    animation: rim-pulse 9s ease-in-out infinite;
  }
  @keyframes rim-pulse { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } }

  /* a small moon orbiting the planet */
  .moon-orbit {
    position: absolute; inset: -7vmin;
    border-radius: 50%;
    animation: orbit 32s linear infinite;
  }
  @keyframes orbit { to { transform: rotate(360deg); } }
  .moon {
    position: absolute; top: -1.5vmin; left: 50%;
    width: 3vmin; height: 3vmin; margin-left: -1.5vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 34%, #ded5e8, #7a688a 58%, #3c3049);
    box-shadow: 0 0 10px rgba(220, 205, 245, 0.45);
  }

  /* periodic shooting stars, staggered across the sky */
  .shoot {
    position: absolute;
    width: 150px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9));
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.7));
    opacity: 0;
  }
  .shoot.a { top: 12%; left: -12%; animation: shoot 9s ease-in 1s infinite; }
  .shoot.b { top: 34%; left: -12%; animation: shoot 12s ease-in 5.5s infinite; }
  .shoot.c { top: 6%;  left: -12%; animation: shoot 15s ease-in 10s infinite; }
  @keyframes shoot {
    0%  { transform: translate(0, 0) rotate(16deg); opacity: 0; }
    2%  { opacity: 1; }
    12% { transform: translate(78vw, 26vh) rotate(16deg); opacity: 0; }
    100% { opacity: 0; }
  }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(4,3,10,0.55) 100%);
  }

  /* ============ CONTENT ============ */
  /* seated in the clear sky above the planet, out of its lit region */
  main {
    position: relative; z-index: 2;
    margin-top: clamp(20vh, 26vh, 30vh);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 34px;
  }

  h1 {
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(34px, 9vw, 52px);
    line-height: 1.16;
    letter-spacing: -0.015em;
    text-shadow: 0 2px 30px rgba(0,0,0,0.55);
    animation: fade-up 1.6s var(--ease) 0.1s both;
  }
  h1 .accent {
    background: linear-gradient(100deg, var(--accent-warm), var(--accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 18px 9px 9px;
    border-radius: 100px;
    background: rgba(255, 253, 248, 0.06);
    border: 1px solid rgba(255, 253, 248, 0.16);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: lowercase;
    text-decoration: none;
    transition: transform 0.35s var(--ease), background 0.35s var(--ease), border-color 0.35s var(--ease);
    animation: fade-up 1.6s var(--ease) 0.28s both;
  }
  .cta:hover { background: rgba(255,253,248,0.11); border-color: rgba(255,253,248,0.28); }
  .cta:active { transform: scale(0.97); }
  .cta .icon { width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; }

  @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .nebula, .stars, .planet-wrap, .surface, .rim, .moon-orbit, .shoot, h1, .cta { animation: none !important; }
    .shoot { display: none; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="space-base"></div>
    <div class="nebula"></div>
    <div class="stars s1"></div>
    <div class="stars s2"></div>
    <div class="stars s3"></div>
    <div class="shoot a"></div>
    <div class="shoot b"></div>
    <div class="shoot c"></div>
    <div class="planet-wrap">
      <div class="planet">
        <div class="surface"></div>
        <div class="shade"></div>
        <div class="rim"></div>
      </div>
      <div class="moon-orbit"><span class="moon"></span></div>
    </div>
    <div class="vignette"></div>
  </div>

  <main>
    <h1>asmi has a<br><span class="accent">new number.</span></h1>

    <a class="cta" href="https://asmi-ai.link/imsg" aria-label="Message asmi on iMessage">
      <svg class="icon" viewBox="0 0 66.145836 66.145836" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="imsgGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0" stop-color="#0cbd2a"/>
            <stop offset="1" stop-color="#5bf675"/>
          </linearGradient>
        </defs>
        <rect width="66.145836" height="66.145836" rx="14.567832" ry="14.567832" fill="url(#imsgGrad)"/>
        <path fill="#fff" d="m 33.072934,11.450461 a 24.278298,20.222157 0 0 0 -24.278105,20.22202 24.278298,20.222157 0 0 0 11.79463,17.31574 27.365264,20.222157 0 0 1 -4.245218,5.94228 23.85735,20.222157 0 0 0 9.86038,-3.87367 24.278298,20.222157 0 0 0 6.868313,0.83768 24.278298,20.222157 0 0 0 24.278106,-20.22203 24.278298,20.222157 0 0 0 -24.278106,-20.22202 z"/>
      </svg>
      message asmi
    </a>
  </main>
</body>
</html>
